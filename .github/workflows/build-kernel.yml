name: Build OnePlus Ace 3V Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ace-3v-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Build kernel
        run: ./build.sh

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Ace-3V-kernel
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
