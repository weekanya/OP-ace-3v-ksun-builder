name: Weekly Release OnePlus Ace 3V Kernel

on:
  schedule:
    - cron: '0 3 * * 0' # Runs every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom tag name (optional, defaults to vYYYY.MM.DD)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ace-3v-kernel-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CLANG_VERSION: clang-r487747c
      USE_CCACHE: "1"
      KBUILD_BUILD_USER: wee
      KBUILD_BUILD_HOST: wee

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Restore Clang toolchain
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/toolchains/linux-x86/${{ env.CLANG_VERSION }}
          key: clang-${{ runner.os }}-${{ runner.arch }}-${{ env.CLANG_VERSION }}

      - name: Download Clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: ./scripts/build.sh sync-toolchain

      - name: Save Clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/toolchains/linux-x86/${{ env.CLANG_VERSION }}
          key: clang-${{ runner.os }}-${{ runner.arch }}-${{ env.CLANG_VERSION }}

      - name: Setup CCache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-release-
            ccache-${{ runner.os }}-

      - name: Build kernel
        run: ./scripts/build.sh

      - name: Determine Release Tag and Title
        id: release-info
        run: |
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.custom_tag }}"
          else
            TAG_NAME="v$(date +'%Y.%m.%d')"
          fi
          RELEASE_TITLE="OnePlus Ace 3V Kernel (${TAG_NAME})"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release-info.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.release-info.outputs.release_title }}
        run: |
          gh release create "$TAG_NAME" \
            artifacts/OnePlus-Ace-3V.zip \
            artifacts/OnePlus-Ace-3V.zip.sha256 \
            artifacts/Image \
            artifacts/Image.sha256 \
            --title "$RELEASE_TITLE" \
            --notes-file artifacts/release_notes.md

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Ace-3V-build-files
          path: |
            artifacts/**
            !artifacts/OnePlus-Ace-3V.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload AnyKernel3 package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Ace-3V-AnyKernel3
          path: artifacts/OnePlus-Ace-3V.zip
          if-no-files-found: warn
          retention-days: 14
